name: QB LAB platform quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qb-lab-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Isolated PostgreSQL migration and access checks
        run: |
          set -o pipefail
          bash scripts/test-qb-lab-database.sh 2>&1 | tee qb-lab-database.log
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Guarded public entry and preserved prototype browser regressions
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: qb-lab-quality-failures
          path: |
            qb-lab-database.log
            playwright-report/
            test-results/
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Complete dependency audit
        run: npm audit --json > npm-audit.json
      - name: Production audit
        if: always()
        run: npm audit --omit=dev --json > npm-audit-production.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qb-lab-dependency-audit
          path: npm-audit*.json
          retention-days: 14
